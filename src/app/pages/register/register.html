<h2>Register</h2>

<form (ngSubmit)="register()" #form="ngForm" novalidate>

  <!-- ERROR DEL BACKEND -->
  <div *ngIf="errorMessage" class="error-backend">
    {{ errorMessage }}
  </div>

  <!-- NAME -->
  <div>
    <label>Name</label>
    <input
      type="text"
      name="name"
      [(ngModel)]="formData.name"
      required
      #name="ngModel"
    />

    <small class="error" *ngIf="name.invalid && name.touched">
      El nombre es obligatorio
    </small>
  </div>

  <!-- EMAIL -->
  <div>
    <label>Email</label>
    <input
      type="email"
      name="email"
      [(ngModel)]="formData.email"
      required
      email
      #email="ngModel"
    />

    <small class="error" *ngIf="email.errors?.['required'] && email.touched">
      El email es obligatorio
    </small>

    <small class="error" *ngIf="email.errors?.['email'] && email.touched">
      El formato del email no es válido
    </small>
  </div>

  <!-- PASSWORD -->
  <div>
    <label>Password</label>
    <input
      type="password"
      name="password"
      [(ngModel)]="formData.password"
      required
      minlength="6"
      #password="ngModel"
    />

    <small class="error" *ngIf="password.errors?.['required'] && password.touched">
      La contraseña es obligatoria
    </small>

    <small class="error" *ngIf="password.errors?.['minlength'] && password.touched">
      La contraseña debe tener al menos 6 caracteres
    </small>
  </div>

  <button type="submit" [disabled]="form.invalid">
    Register
  </button>

  <p>
    Already have an account?
    <a routerLink="/login">Login</a>
  </p>

</form>
