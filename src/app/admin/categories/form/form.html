<div class="container mt-5">
  <h1 class="mb-4">
    {{ isEditMode ? 'Editar Categoría' : 'Crear Nueva Categoría' }}
  </h1>

  @if (!loading) {
    <form (ngSubmit)="save()" #categoryForm="ngForm">
      <div class="mb-3">
        <label for="name" class="form-label">Nombre de la Categoría</label>
        <input
          type="text"
          class="form-control"
          id="name"
          name="name"
          [(ngModel)]="form.name"
          required>
      </div>

      <button
        type="submit"
        class="btn"
        [class.btn-success]="!isEditMode"
        [class.btn-primary]="isEditMode">
        {{ isEditMode ? 'Actualizar Categoría' : 'Crear Categoría' }}
      </button>

      <a routerLink="/admin/categorias/listado" class="btn btn-secondary ms-2">
        Volver al Listado
      </a>
    </form>
  } @else {
    <p class="text-muted">Cargando categoría...</p>
  }
</div>
