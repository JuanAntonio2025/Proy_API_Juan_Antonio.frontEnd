<nav class="navbar navbar-expand-lg bg-white border-bottom py-3 sticky-top">
  <div class="container">

    <a class="navbar-brand fw-bolder text-danger" routerLink="/">
      Change.org
    </a>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">

      @if (isLoggedIn()) {
        <ul class="navbar-nav me-auto ms-lg-3">
          <li class="nav-item">
            <a class="nav-link fw-bold" routerLink="/mis-peticiones">
              Mis peticiones
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-bold" routerLink="/mis-firmas">
              Mis firmas
            </a>
          </li>
        </ul>
      }

      <div class="d-flex align-items-center ms-auto">

        <a routerLink="/peticiones"
           class="btn btn-link fw-bold text-dark me-2">
          Ver Peticiones
        </a>

        @if (isLoggedIn()) {
          <a routerLink="/profile"
             class="btn btn-outline-dark fw-bold me-2">
            Mi perfil
          </a>

          <a routerLink="/peticiones/create"
             class="btn btn-outline-dark fw-bold me-2">
            Inicia una petición
          </a>

          <button class="btn btn-danger fw-bold"
                  (click)="logout()">
            Cerrar sesión
          </button>
        } @else {
          <a routerLink="/login"
             class="btn btn-outline-dark fw-bold me-2">
            Entrar
          </a>

          <a routerLink="/register"
             class="btn btn-outline-dark fw-bold">
            Registrarse
          </a>
        }

      </div>
    </div>

    @if (auth.showWelcome()) {
      <div class="modal-backdrop fade show"></div>

      <div class="modal fade show d-block" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">

            <div class="modal-header">
              <h5 class="modal-title">
                ¡Bienvenido/a!
              </h5>
              <button
                type="button"
                class="btn-close"
                (click)="closeWelcome()">
              </button>
            </div>

            <div class="modal-body">
              <p>
                Hola <strong>{{ auth.currentUser()?.name }}</strong>,
                nos alegra verte de nuevo!
              </p>
            </div>

            <div class="modal-footer">
              <button
                class="btn btn-primary"
                (click)="closeWelcome()">
                Continuar
              </button>
            </div>

          </div>
        </div>
      </div>
    }
  </div>
</nav>
