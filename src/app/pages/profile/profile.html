<div class="container py-5">
  @if (user$ | async; as user) {

    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">

        <div class="card shadow-sm">
          <div class="card-header bg-white border-bottom">
            <h3 class="mb-0 fw-bold">Mi perfil</h3>
          </div>

          <div class="card-body p-4">
            <div class="d-flex align-items-center mb-4">
              <img
                class="profile-avatar me-3"
                [src]="'https://placehold.co/64x64/585858/fff?text=' + (user.name?.charAt(0)?.toUpperCase() ?? 'U')"
                alt="Avatar" />

              <div>
                <div class="fw-bold fs-5">{{ user.name }}</div>
                <div class="text-muted">{{ user.email }}</div>
              </div>
            </div>

            <div class="profile-info">
              <div class="profile-row">
                <span class="text-muted">Nombre</span>
                <span class="fw-semibold">{{ user.name }}</span>
              </div>

              <div class="profile-row">
                <span class="text-muted">Email</span>
                <span class="fw-semibold">{{ user.email }}</span>
              </div>
            </div>

            <div class="d-flex justify-content-end mt-4">
              <button class="btn btn-danger fw-bold" (click)="logout()">
                Cerrar sesión
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>

  } @else {
    <p class="text-muted">Cargando perfil...</p>
  }
</div>
