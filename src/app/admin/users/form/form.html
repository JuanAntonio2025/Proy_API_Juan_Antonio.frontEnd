<div class="container mt-5">
  <h1 class="mb-4">
    {{ isEditMode ? 'Editar Usuario' : 'Crear Nuevo Usuario' }}
  </h1>

  @if (!loading) {
    <form (ngSubmit)="save()" #userForm="ngForm">
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input
          type="text"
          name="name"
          class="form-control"
          [(ngModel)]="form.name"
          required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input
          type="email"
          name="email"
          class="form-control"
          [(ngModel)]="form.email"
          required>
      </div>

      <div class="mb-3">
        <label class="form-label">
          {{ isEditMode ? 'Nueva Contraseña (opcional)' : 'Contraseña' }}
        </label>
        <input
          type="password"
          name="password"
          class="form-control"
          [(ngModel)]="form.password"
          [required]="!isEditMode">
      </div>

      <div class="mb-3">
        <label class="form-label">Rol</label>
        <select
          name="role"
          class="form-select"
          [(ngModel)]="form.role"
          required>
          <option [ngValue]="0">Usuario</option>
          <option [ngValue]="1">Administrador</option>
        </select>
      </div>

      <button
        class="btn"
        type="submit"
        [class.btn-success]="!isEditMode"
        [class.btn-primary]="isEditMode">
        {{ isEditMode ? 'Actualizar Usuario' : 'Crear Usuario' }}
      </button>

      <a routerLink="/admin/usuarios/listado" class="btn btn-secondary ms-2">
        Volver al Listado
      </a>
    </form>
  } @else {
    <p class="text-muted">Cargando usuario...</p>
  }
</div>
